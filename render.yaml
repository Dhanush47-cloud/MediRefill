services:
  - type: web
    name: medirefill-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PRESCRIPTION_ENCRYPTION_KEY
        sync: false
      - key: OTP_PEPPER
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/medirefill.db
      - key: UPLOAD_DIR
        value: /var/data/private_uploads
    disk:
      name: medirefill-private-data
      mountPath: /var/data
      sizeGB: 1
