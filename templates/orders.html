{% extends 'base.html' %}{% block body %}<h1>Order tracking</h1><div class="card"><table><tr><th>Order</th><th>Store</th><th>Total</th><th>Payment</th><th>Status</th><th>Note</th></tr>{% for o in rows %}<tr><td>{{o.order_code}}</td><td>{{o.store}}</td><td>₹{{'%.2f'|format(o.total)}}</td><td>{{o.payment_method}}</td><td><span class="pill">{{o.status}}</span></td><td>{{o.verification_note}}</td></tr>{% else %}<tr><td colspan="6">No orders found.</td></tr>{% endfor %}</table></div>{% endblock %}
